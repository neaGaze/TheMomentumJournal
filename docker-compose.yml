# App only. Postgres runs separately — see docker-compose.db.yml.
# Bring the DB up first (it creates the shared `momentum-net` network), then:
#   docker compose up -d --build
#   docker compose down            # leaves the DB container/volume untouched
services:
  web:
    build: .
    container_name: momentum-web
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      # Reach the standalone Postgres by its container name over the shared network.
      DATABASE_URL: postgres://momentum:momentum@momentum-postgres:5432/momentum
      # Auth.js v5 trusts the reverse-proxy forwarded host/proto (required when
      # served behind Cloudflare Tunnel / nginx / Caddy, else UntrustedHost).
      AUTH_TRUST_HOST: "true"
    ports:
      # localhost-only: the reverse proxy / tunnel reaches the app here.
      - 3000:3000
    networks:
      - momentum-net

networks:
  # Created by docker-compose.db.yml; must be up before the app.
  momentum-net:
    external: true
    name: momentum-net
