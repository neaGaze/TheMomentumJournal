# Run AFTER `supabase start` on the same host.
# Uses host networking (Linux): the container shares the host net namespace, so
# 127.0.0.1:54321 (Kong) is reachable directly, and the app publishes :3000 to
# the host without a `ports:` mapping.
#
# Usage on Ubuntu:
#   supabase start                                     # boots Postgres + GoTrue + Kong on host
#   docker compose -f docker-compose.app.yml up -d --build
#   docker compose -f docker-compose.app.yml down
services:
  web:
    build: .
    container_name: momentum-web
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.local
    environment:
      # Server-side Supabase calls take the fast loopback path.
      # NEXT_PUBLIC_SUPABASE_URL in .env.local should be the URL the BROWSER uses
      # (LAN IP or your Cloudflare hostname for Supabase).
      SUPABASE_INTERNAL_URL: http://127.0.0.1:54321
